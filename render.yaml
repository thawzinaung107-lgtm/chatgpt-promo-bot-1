services:
  - type: web
    name: telegram-content-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_RESPONSE_FORMAT
        value: auto
      - key: LLM_MAX_TOKENS_PARAM
        value: auto
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      - key: LLM_MAX_RETRIES
        value: "2"
      - key: LLM_REASONING_EFFORT
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: TARGETS_JSON
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: API_KEY_ENCRYPTION_KEY
        sync: false
      - key: MAX_INPUT_CHARS
        value: "8000"
      - key: LOG_LEVEL
        value: INFO
