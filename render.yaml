services:
  - type: web
    name: telegram-content-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        value: gpt-5-mini
      - key: ADMIN_IDS
        sync: false
      - key: TARGETS_JSON
        sync: false
      - key: MAX_INPUT_CHARS
        value: "8000"
      - key: LOG_LEVEL
        value: INFO
